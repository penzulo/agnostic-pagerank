[project]
name = "agnostic-pagerank"
version = "0.1.0"
description = "A data-agnostic PageRank library: solvers operate on graphs, adapters convert any dataset into a graph."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "penzulo", email = "bhardesh2005@gmail.com" }]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "httpx>=0.28.1",
  "matplotlib>=3.11.2",
  "networkx>=3.7",
  "numpy>=2.5.3",
  "pyvis>=0.3.2",
  "requests>=2.34.2",
  "returns>=0.29.0",
  "scipy>=1.18.1",
]

[project.scripts]
agnostic-pagerank = "agnostic_pagerank:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "B9",
  "C4",
  "SIM",
  "I",
  "UP",
  "PIE",
  "PGH",
  "PYI",
  "RUF",
]
ignore = ["B011", "E501"]

[tool.ruff.format]
docstring-code-format = true
